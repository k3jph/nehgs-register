name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live
        uses: zauguin/install-texlive@v4
        with:
          packages: >
            l3build
            latex
            latex-bin
            tools
            l3packages
            enumitem
            etoolbox
            datetime2
            datetime2-english
            tracklang
            hyperref
            hypdoc
            imakeidx
            makeindex
            lm
            ec

      - name: Build package
        run: l3build unpack

      - name: Run tests
        run: l3build check

      - name: Show test diffs
        if: failure()
        run: |
          cat build/test/*.diff 2>/dev/null || true
          echo "=== Raw log (basic, last 80 lines) ==="
          tail -80 build/test/basic.log 2>/dev/null || true
          echo "=== Checking key packages ==="
          kpsewhich xspace.sty xparse.sty regression-test.tex 2>&1 || true
          echo "=== Normalized log (basic) ==="
          cat build/test/basic.pdftex.log 2>/dev/null || true

      - name: Build documentation
        run: l3build doc

      - name: Build CTAN archive
        run: l3build ctan

      - name: Verify CTAN archive contents
        shell: bash
        run: |
          set -euo pipefail

          archive="$(find . -maxdepth 1 -type f -name 'nehgs-register-*.zip' ! -name '*.tds.zip' -print -quit)"
          if [[ -z "$archive" ]]; then
            echo "CTAN archive was not produced" >&2
            exit 1
          fi

          mapfile -t entries < <(unzip -Z1 "$archive")
          for example in \
            getting-started.tex \
            minimal-register.tex \
            multi-marriage.tex \
            stuart-register.tex
          do
            expected="nehgs-register/examples/$example"
            if [[ ! " ${entries[*]} " =~ " $expected " ]]; then
              echo "Missing CTAN example: $expected" >&2
              exit 1
            fi
          done

          for test_path in testfiles/*; do
            test_name="${test_path##*/}"
            for entry in "${entries[@]}"; do
              if [[ "$entry" == *"/testfiles/"* || "$entry" == "nehgs-register/$test_name" ]]; then
                echo "Regression test leaked into CTAN archive: $entry" >&2
                exit 1
              fi
            done
          done

          tds_archive="$(mktemp)"
          trap 'rm -f "$tds_archive"' EXIT
          unzip -p "$archive" nehgs-register.tds.zip > "$tds_archive"
          mapfile -t tds_entries < <(unzip -Z1 "$tds_archive")

          for test_path in testfiles/*; do
            test_name="${test_path##*/}"
            for entry in "${tds_entries[@]}"; do
              if [[ "$entry" == *"/testfiles/"* || "$entry" == */"$test_name" ]]; then
                echo "Regression test leaked into TDS archive: $entry" >&2
                exit 1
              fi
            done
          done
